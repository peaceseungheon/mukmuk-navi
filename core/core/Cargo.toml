[package]
name = "mukmuk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rkyv = { version = "0.8.18", features = ["bytecheck"] }
memmap2 = "0.9.12"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
fast_paths = "1.0.0"
tempfile = "3"
memory-stats = "1"
